name: uptime
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min (GitHub may add a few min of jitter)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe n8n.recluta.app
        run: |
          # 3 attempts, 30s apart, so one blip doesn't page. All 3 failing
          # fails the workflow -> GitHub emails the repo owner.
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://n8n.recluta.app/healthz || echo 000)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 30
          done
          echo "::error::n8n.recluta.app/healthz unreachable after 3 attempts — the Recluta bot is DOWN"
          exit 1

  keepalive:
    # GitHub disables cron workflows after 60 days without repo activity.
    # The first version committed only if a run landed between 03:00 and 03:14
    # UTC on the 1st of the month. GitHub throttles cron on quiet repos (by
    # October it ran this "every 10 min" schedule every 3-5 hours), so no run
    # ever hit that window and the schedule was disabled on 2026-10-16, exactly
    # 60 days after the first commit. Now any scheduled run commits once the
    # last commit is 30+ days old: that leaves a month of margin, and needs only
    # one run of any kind in it.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keepalive commit when the repo has been quiet for 30 days
        run: |
          age_days=$(( ( $(date -u +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "last commit ${age_days} days ago"
          if [ "$age_days" -ge 30 ]; then
            git config user.name "uptime-bot"
            git config user.email "actions@github.com"
            git commit --allow-empty -m "keepalive $(date -u +%Y-%m-%d)"
            git push
          fi
